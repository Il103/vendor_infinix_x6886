[policy_type]
# If permanent= Yes, this policy is still valid after reboot
permanent= Yes

[LTF]
thermal_zone= soc_max
mode= enabled

[mtk-skin-control]
sensor= ap_ntc
max_target_tj= 85000
min_target_tj= 60000
trip_tpcb= 48000
target_tpcb= 51000

[mtk-cpu-table-mapping]
mode= enabled
sensor= ap_ntc
cluster= 0
threshold= [43000, 45000, 48000]
hysteresis= [2000, 2000, 2000]
freq= [1800000, 1600000, 1300000]

[mtk-cpu-table-mapping]
mode= enabled
sensor= ap_ntc
cluster= 1
threshold= [43000, 45000, 48000]
hysteresis= [2000, 2000, 2000]
freq= [2000000, 1700000, 1500000]

[charger-cooler]
mode= enabled
sensor= ap_ntc
threshold= [40000, 42000, 45000, 56000]
hysteresis= [2000, 2000, 2000, 2000]
current= [1800, 1000, 500, 0]

[thermalhal-threshold]
type= SKIN
sensor= ap_ntc
level= [severe, critical, emergency, shutdown]
threshold= [47000, 56000, 58000, 80000]