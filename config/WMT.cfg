# WMT Configuration for Infinix Hot 60 Pro Plus (X6886)

# MT6789 Connsys Configuration

# WMT Version
WMT_VERSION=1.0

# WMT Device
WMT_DEVICE=mt6789

# WMT UART
WMT_UART=/dev/ttyMT0

# WMT Baud Rate
WMT_BAUD_RATE=921600

# WMT Flow Control
WMT_FLOW_CONTROL=0

# WMT Data Bits
WMT_DATA_BITS=8

# WMT Stop Bits
WMT_STOP_BITS=1

# WMT Parity
WMT_PARITY=0

# WMT Bluetooth
WMT_BT=1

# WMT WiFi
WMT_WIFI=1

# WMT GPS
WMT_GPS=1

# WMT FM
WMT_FM=0

# WMT NFC
WMT_NFC=1

# WMT UWB
WMT_UWB=0

# WMT ANT+
WMT_ANT=0

# WMT GPS LNA
WMT_GPS_LNA=1

# WMT GPS LNA GPIO
WMT_GPS_LNA_GPIO=12

# WMT GPS LNA VBAT
WMT_GPS_LNA_VBAT=0

# WMT GPS LNA VIO
WMT_GPS_LNA_VIO=0

# WMT GPS LNA EN
WMT_GPS_LNA_EN=0

# WMT GPS LNA ELNA
WMT_GPS_LNA_ELNA=0

# WMT GPS LNA ELNA GPIO
WMT_GPS_LNA_ELNA_GPIO=0

# WMT GPS LNA ELNA VBAT
WMT_GPS_LNA_ELNA_VBAT=0

# WMT GPS LNA ELNA VIO
WMT_GPS_LNA_ELNA_VIO=0

# WMT GPS LNA ELNA EN
WMT_GPS_LNA_ELNA_EN=0
