# Bluetooth Vendor Configuration for Infinix Hot 60 Pro Plus (X6886)

# Enable BT
Enable=1

# UART port
UartPort=/dev/ttyMT1

# UART baud rate
UartBaudRate=921600

# Firmware patch path
FirmwarePatchPath=/vendor/firmware/

# Firmware patch file
FirmwarePatchFile=MT6639_E3_P1_W1_20240429_AIROHA_CONNSYS_RAM_BIN

# SCO over PCM
ScoInterface=PCM

# PCM settings
PcmInterface=PCM

# I2S settings
I2sInterface=0

# PCM clock settings
PcmClock=0

# PCM sync width
PcmSyncWidth=0

# PCM data format
PcmDataFormat=0

# PCM endian
PcmEndian=0

# PCM mode
PcmMode=0

# PCM channel mode
PcmChannelMode=1

# PCM sample rate
PcmSampleRate=8000

# PCM bits per sample
PcmBitsPerSample=16

# PCM buffer size
PcmBufferSize=2048

# PCM buffer count
PcmBufferCount=4

# PCM read timeout
PcmReadTimeout=1000

# PCM write timeout
PcmWriteTimeout=1000

# PCM read block size
PcmReadBlockSize=480

# PCM write block size
PcmWriteBlockSize=480

# PCM read block count
PcmReadBlockCount=4

# PCM write block count
PcmWriteBlockCount=4

# PCM read buffer size
PcmReadBufferSize=1920

# PCM write buffer size
PcmWriteBufferSize=1920

# PCM read buffer count
PcmReadBufferCount=4

# PCM write buffer count
PcmWriteBufferCount=4

# PCM read timeout
PcmReadTimeout=1000

# PCM write timeout
PcmWriteTimeout=1000

# PCM read block size
PcmReadBlockSize=480

# PCM write block size
PcmWriteBlockSize=480

# PCM read block count
PcmReadBlockCount=4

# PCM write block count
PcmWriteBlockCount=4

# PCM read buffer size
PcmReadBufferSize=1920

# PCM write buffer size
PcmWriteBufferSize=1920

# PCM read buffer count
PcmReadBufferCount=4

# PCM write buffer count
PcmWriteBufferCount=4
